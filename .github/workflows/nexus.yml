# Uploads each release to Nexus Mods. A full release becomes a new version of the mod's main file (NEXUS_FILE_ID) and
# the mod's version; a pre-release becomes a new version of the beta file (NEXUS_BETA_FILE_ID, an Optional file on the
# mod page) and leaves the mod's version alone. Drafts are never uploaded. Runs on publish, or by hand with a tag.
name: nexus
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v0.8.0)"
        type: string
        required: true
concurrency:
  group: nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
permissions: {}

jobs:
  nexus:
    if: github.repository == 'Dudiebug/halfsword-multiplayer-mod'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the release
        id: rel
        env:
          MOD_ID: ${{ vars.NEXUS_MOD_ID }}
          FILE_ID: ${{ vars.NEXUS_FILE_ID }}
          BETA_FILE_ID: ${{ vars.NEXUS_BETA_FILE_ID }}
        run: |
          set -euo pipefail
          info=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,body)
          if [ "$(jq -r .isDraft <<<"$info")" = "true" ]; then echo "::error::$TAG is a draft"; exit 1; fi
          if [ "$(jq -r .isPrerelease <<<"$info")" = "true" ]; then
            file="$BETA_FILE_ID"; main=false; suffix=" (beta)"
            [ -n "$file" ] || { echo "::error::set NEXUS_BETA_FILE_ID (the beta file's id on Nexus) first"; exit 1; }
          else
            file="$FILE_ID"; main=true; suffix=""
          fi
          [ -n "$MOD_ID" ] && [ -n "$file" ] || { echo "::error::set NEXUS_MOD_ID and NEXUS_FILE_ID first"; exit 1; }
          { echo "file_id=$file"; echo "main=$main"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<HSM_NOTES_EOF"
            jq -r .body <<<"$info"
            echo "HSM_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download the DLL
        run: |
          set -euo pipefail
          # Assets can land a moment after the release is published; wait up to 5 minutes.
          for i in $(seq 1 30); do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p dwmapi.dll -D "$RUNNER_TEMP/dl" --clobber 2>/dev/null; then
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::$TAG has no dwmapi.dll asset"; exit 1; }
            sleep 10
          done
          sha256sum "$RUNNER_TEMP/dl/dwmapi.dll"

      # The zip mirrors the game folder so mod managers put the DLL next to the exe.
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          stage="$RUNNER_TEMP/nexus"
          mkdir -p "$stage/HalfswordUE5/Binaries/Win64"
          cp "$RUNNER_TEMP/dl/dwmapi.dll" "$stage/HalfswordUE5/Binaries/Win64/"
          cat > "$stage/INSTALL.txt" <<'EOF'
          Half Sword Multiplayer (HSMMod)

          Install
          1. Extract this zip into your Half Sword folder (the one with HalfswordUE5 in it),
             or copy dwmapi.dll into <Half Sword>/HalfswordUE5/Binaries/Win64/ by hand.
          2. Using UE4SS? Copy HSMMod's dwmapi.dll over UE4SS's dwmapi.dll. HSMMod then loads UE4SS for you.
          3. Start the game and click MULTIPLAYER on the main menu.

          Every player in a lobby needs the same HSMMod version.
          Discord: https://discord.gg/QZcSFnwxra
          GitHub: https://github.com/Dudiebug/halfsword-multiplayer-mod
          EOF
          zip_name="HalfSwordMP-$ver.zip"
          (cd "$stage" && zip -r "$GITHUB_WORKSPACE/$zip_name" .)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "nexus_version=${ver//_/-}" >> "$GITHUB_OUTPUT"   # Nexus versions allow only letters, digits, . and -
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        id: upload
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.rel.outputs.file_id }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          filename: ${{ steps.pkg.outputs.zip }}
          display_name: Half Sword Multiplayer ${{ steps.pkg.outputs.version }}${{ steps.rel.outputs.suffix }}
          version: ${{ steps.pkg.outputs.nexus_version }}
          update_mod_version: ${{ steps.rel.outputs.main == 'true' }}
          archive_existing_version: true
          changelog: ${{ steps.rel.outputs.changelog }}

      - name: Summary
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          echo "Uploaded $ZIP to Nexus Mods (version id $VERSION_ID)" >> "$GITHUB_STEP_SUMMARY"
